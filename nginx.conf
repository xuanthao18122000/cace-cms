# Template cho image nginx chính thức: các biến ${...} được envsubst lúc container khởi động
# (/etc/nginx/templates/*.template → /etc/nginx/conf.d/). Biến nginx như $uri giữ nguyên.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Phân giải tên dịch vụ lúc chạy (Docker DNS), API chưa lên thì nginx vẫn khởi động được
    resolver ${NGINX_RESOLVER} valid=30s ipv6=off;

    # PDF tối đa 20 MB (PdfUpload / API) + phần đầu multipart
    client_max_body_size 21m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Upload chạy ở process riêng: khai báo trước /api
    location /api/uploads/ {
        set $upload_upstream ${UPLOAD_UPSTREAM};
        proxy_pass $upload_upstream;
    }

    location /uploads/ {
        set $upload_upstream ${UPLOAD_UPSTREAM};
        proxy_pass $upload_upstream;
    }

    location /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
    }

    # Tệp build có hash trong tên: cache lâu
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: mọi đường dẫn khác trả index.html, không cache
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
